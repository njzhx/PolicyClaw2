name: 政策爬虫（Windows 自托管手动运行）

on:
  workflow_dispatch:
    inputs:
      crawl_mode:
        description: '日期模式：sliding_window、single_date 或 date_range'
        required: true
        default: 'sliding_window'
        type: choice
        options:
          - sliding_window
          - single_date
          - date_range
      crawl_window_days:
        description: '滑动窗口天数（sliding_window 模式）'
        required: false
        default: '7'
        type: string
      crawl_date:
        description: '补跑日期（single_date 模式，YYYY-MM-DD）'
        required: false
        default: ''
        type: string
      crawl_date_from:
        description: '补跑开始日期（date_range 模式，YYYY-MM-DD）'
        required: false
        default: ''
        type: string
      crawl_date_to:
        description: '补跑结束日期（date_range 模式，YYYY-MM-DD）'
        required: false
        default: ''
        type: string
      crawler_files:
        description: '指定爬虫文件（留空运行全部；多个用英文逗号分隔）'
        required: false
        default: ''
        type: string
      enable_supabase_write:
        description: '是否写入 Supabase'
        required: false
        default: true
        type: boolean
      enable_api_push:
        description: '是否推送 API'
        required: false
        default: true
        type: boolean
      enable_feishu_notify:
        description: '是否推送飞书结果提醒'
        required: false
        default: true
        type: boolean
      verbose_crawler_log:
        description: '是否输出每个爬虫的原始日志'
        required: false
        default: false
        type: boolean

jobs:
  crawl:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装依赖
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          playwright install chromium

      - name: 校验日期运行参数
        shell: powershell
        run: |
          python -c "from crawler_core import format_date_window, get_crawl_date_window; start, end = get_crawl_date_window(); print(f'日期参数校验通过，目标日期窗口：{format_date_window(start, end)}')"
        env:
          CRAWL_MODE: ${{ inputs.crawl_mode }}
          CRAWL_DATE: ${{ inputs.crawl_date }}
          CRAWL_DATE_FROM: ${{ inputs.crawl_date_from }}
          CRAWL_DATE_TO: ${{ inputs.crawl_date_to }}
          CRAWL_WINDOW_DAYS: ${{ inputs.crawl_window_days }}

      - name: 创建 results 目录
        shell: powershell
        run: New-Item -ItemType Directory -Path results -Force | Out-Null

      - name: 执行爬虫并保存输出
        shell: powershell
        run: |
          $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
          python crawler_manager.py 2>&1 | Tee-Object -FilePath "results/crawler_output_$timestamp.md"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          CRAWL_MODE: ${{ inputs.crawl_mode }}
          CRAWL_DATE: ${{ inputs.crawl_date }}
          CRAWL_DATE_FROM: ${{ inputs.crawl_date_from }}
          CRAWL_DATE_TO: ${{ inputs.crawl_date_to }}
          CRAWL_WINDOW_DAYS: ${{ inputs.crawl_window_days }}
          POLICYCLAW_CRAWLER_FILES: ${{ inputs.crawler_files }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_TABLE: policyclaw2
          VPS_IP: ${{ secrets.VPS_IP }}
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          POLICYCLAW_ENABLE_SUPABASE_WRITE: ${{ inputs.enable_supabase_write && '1' || '0' }}
          POLICYCLAW_ENABLE_API_PUSH: ${{ inputs.enable_api_push && '1' || '0' }}
          POLICYCLAW_ENABLE_FEISHU_NOTIFY: ${{ inputs.enable_feishu_notify && '1' || '0' }}
          POLICYCLAW_VERBOSE_CRAWLER_LOG: ${{ inputs.verbose_crawler_log && '1' || '0' }}

      - name: 上传运行结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-windows-results-${{ github.run_number }}
          path: results/
          retention-days: 30
