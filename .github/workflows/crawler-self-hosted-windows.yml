name: 政策爬虫（Windows Self-hosted）

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      crawl_mode:
        description: '日期模式'
        required: true
        default: sliding_window
        type: choice
        options:
          - sliding_window
          - single_date
          - date_range
      crawl_window_days:
        description: '滑动窗口天数（sliding_window）'
        required: false
        default: '7'
        type: string
      crawl_date:
        description: '补跑日期 YYYY-MM-DD（single_date）'
        required: false
        default: ''
        type: string
      crawl_date_from:
        description: '开始日期 YYYY-MM-DD（date_range）'
        required: false
        default: ''
        type: string
      crawl_date_to:
        description: '结束日期 YYYY-MM-DD（date_range）'
        required: false
        default: ''
        type: string
      crawler_files:
        description: '指定爬虫文件（留空运行全部；多个用英文逗号分隔）'
        required: false
        default: ''
        type: string
      enable_supabase_write:
        description: '是否写入 Supabase'
        required: false
        default: false
        type: boolean
      enable_api_push:
        description: '是否推送 API'
        required: false
        default: false
        type: boolean
      enable_feishu_notify:
        description: '是否推送飞书结果提醒'
        required: false
        default: false
        type: boolean
      verbose_crawler_log:
        description: '是否输出每个爬虫的原始日志'
        required: false
        default: false
        type: boolean

concurrency:
  group: policyclaw-self-hosted-windows
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  crawl:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      POLICYCLAW_BASE_PYTHON: 'C:\Python310\python.exe'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      CRAWL_MODE: ${{ inputs.crawl_mode || 'sliding_window' }}
      CRAWL_DATE: ${{ inputs.crawl_date || '' }}
      CRAWL_DATE_FROM: ${{ inputs.crawl_date_from || '' }}
      CRAWL_DATE_TO: ${{ inputs.crawl_date_to || '' }}
      CRAWL_WINDOW_DAYS: ${{ inputs.crawl_window_days || '7' }}
      POLICYCLAW_CRAWLER_FILES: ${{ inputs.crawler_files || '' }}
      SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_TABLE: policyclaw2
      VPS_IP: ${{ secrets.VPS_IP }}
      FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
      POLICYCLAW_ENABLE_SUPABASE_WRITE: ${{ github.event_name == 'schedule' && '1' || (inputs.enable_supabase_write && '1' || '0') }}
      POLICYCLAW_ENABLE_API_PUSH: ${{ github.event_name == 'schedule' && '1' || (inputs.enable_api_push && '1' || '0') }}
      POLICYCLAW_ENABLE_FEISHU_NOTIFY: ${{ github.event_name == 'schedule' && '1' || (inputs.enable_feishu_notify && '1' || '0') }}
      POLICYCLAW_VERBOSE_CRAWLER_LOG: ${{ inputs.verbose_crawler_log && '1' || '0' }}
      POLICYCLAW_RUNNER_TYPE: local

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Find latest hosted crawler run
        if: github.event_name == 'schedule'
        id: hosted-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/crawler.yml/runs?branch=main&event=schedule&status=completed&per_page=10"
          $response = Invoke-RestMethod -Uri $uri -Headers $headers
          $run = $response.workflow_runs |
            Where-Object { $_.conclusion -eq 'success' } |
            Select-Object -First 1
          if (-not $run) {
            throw 'No completed successful hosted crawler run found.'
          }
          if ([DateTimeOffset]::UtcNow - [DateTimeOffset]$run.updated_at -gt [TimeSpan]::FromHours(12)) {
            throw "Latest hosted crawler run is older than 12 hours: $($run.html_url)"
          }
          "run_id=$($run.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "run_number=$($run.run_number)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Hosted run: $($run.html_url)"

      - name: Download hosted failure manifest
        if: github.event_name == 'schedule'
        uses: actions/download-artifact@v4
        with:
          name: crawler-results-${{ steps.hosted-run.outputs.run_number }}
          path: hosted-results
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.hosted-run.outputs.run_id }}

      - name: Prepare hosted retry selection
        if: github.event_name == 'schedule'
        run: |
          $manifestPath = Join-Path 'hosted-results' 'failed_crawlers.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Failure manifest not found: $manifestPath"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 |
            ConvertFrom-Json
          $crawlerFiles = @($manifest.crawler_files | Where-Object { $_ })
          "CRAWL_MODE=date_range" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CRAWL_DATE=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CRAWL_DATE_FROM=$($manifest.date_from)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CRAWL_DATE_TO=$($manifest.date_to)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CRAWL_WINDOW_DAYS=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "POLICYCLAW_CRAWLER_FILES=$($crawlerFiles -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($crawlerFiles.Count -eq 0) {
            "POLICYCLAW_SKIP_CRAWL=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Output 'Hosted run reported no failed crawler lists; retry will be skipped.'
          } else {
            Write-Output "Retry crawler files ($($crawlerFiles.Count)): $($crawlerFiles -join ', ')"
          }

      - name: 创建结果目录
        run: New-Item -ItemType Directory -Force -Path results | Out-Null

      - name: 显示运行环境
        run: |
          if (-not (Test-Path -LiteralPath $env:POLICYCLAW_BASE_PYTHON)) {
            throw "Python not found: $env:POLICYCLAW_BASE_PYTHON"
          }
          & $env:POLICYCLAW_BASE_PYTHON --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "Runner: $env:RUNNER_NAME"
          Write-Output "OS: $env:RUNNER_OS / $env:RUNNER_ARCH"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, TotalVisibleMemorySize, FreePhysicalMemory |
            Format-List

      - name: 创建虚拟环境并安装依赖
        run: |
          $venvPath = Join-Path $env:GITHUB_WORKSPACE '.venv'
          $venvPython = Join-Path $venvPath 'Scripts\python.exe'

          & $env:POLICYCLAW_BASE_PYTHON -m venv $venvPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $venvPython)) {
            throw "Virtual environment Python not found: $venvPython"
          }

          "POLICYCLAW_PYTHON=$venvPython" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $venvPython -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath requirements.txt) {
            & $venvPython -m pip install -r requirements.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 校验日期运行参数
        run: |
          @'
          from crawler_core import format_date_window, get_crawl_date_window

          start, end = get_crawl_date_window()
          print(f"日期参数校验通过，目标日期窗口：{format_date_window(start, end)}")
          '@ | & $env:POLICYCLAW_PYTHON -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 检查 Chrome
        run: |
          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $chromePaths | Where-Object { $_ -and (Test-Path -LiteralPath $_) } |
            Select-Object -First 1
          if ($chrome) {
            Write-Output "Chrome: $chrome"
            & $chrome --version
          } else {
            Write-Warning "未发现 Google Chrome；普通 HTML/API 爬虫仍可运行，Selenium 爬虫可能失败。"
          }

      - name: 执行爬虫
        id: crawler
        if: env.POLICYCLAW_SKIP_CRAWL != '1'
        run: |
          $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
          $outputFile = Join-Path 'results' "crawler_output_$timestamp.md"
          $errorFile = Join-Path 'results' "crawler_error_$timestamp.log"

          $processArgs = @{
            FilePath = $env:POLICYCLAW_PYTHON
            ArgumentList = @('-u', 'crawler_manager.py')
            RedirectStandardOutput = $outputFile
            RedirectStandardError = $errorFile
            NoNewWindow = $true
            PassThru = $true
            Wait = $true
          }
          $process = Start-Process @processArgs

          if (Test-Path -LiteralPath $outputFile) {
            Get-Content -LiteralPath $outputFile -Encoding UTF8
          }
          if ((Test-Path -LiteralPath $errorFile) -and
              (Get-Item -LiteralPath $errorFile).Length -gt 0) {
            Write-Output "----- stderr -----"
            Get-Content -LiteralPath $errorFile -Encoding UTF8
          }

          exit $process.ExitCode

      - name: 上传运行结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-self-hosted-windows-${{ github.run_number }}
          path: results/
          retention-days: 30
          if-no-files-found: warn

      - name: 输出执行结果
        if: always()
        run: Write-Output 'Crawler job finished. Check logs and artifacts.'
